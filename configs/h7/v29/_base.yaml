# v29 milestone queries + local refinement: shared SCE recipe, validation only
# Generated by scripts/make_v29_configs.py -- do not edit by hand.
inherits: configs/h7/v26/_base.yaml
builder: cached_video_validation_training
cfg:
  experiment:
    id: v29_base_do_not_run
    out_root: runs/h7/v29
    tags:
    - v29
    - milestone-query
    - patient-grouped
    - trainval-only
    notes: SCE encoder + milestone onset localisation on frozen v26 visual features
  data:
    input_mode: visual
    sequence_mode: full
  model:
    type: milestone_query_adapter
    backbone:
      name: cached_features
    head:
      name: none
    milestone:
      variant: query_refine
      hidden: 96
      layers: 6
      intermediate_layers:
      - 2
      - 4
      - 6
      attention_reduction: 2
      dropout: 0.5
      query_dim: 128
      query_layers: 2
      query_heads: 4
      query_dropout: 0.1
      local_kernel: 5
      refine_radius: 8
      combine_weight: 1.0
    num_classes: 16
    dropout: 0.5
  loss:
    name: milestone_objective
    semantic_weight: 0.8
    smooth_weight: 0.3
    milestone_weight: 1.0
    combined_weight: 0.8
    truncation: 4.0
    target_sigma: 1.0
  optimizer:
    name: adamw
    lr: 0.0001
    weight_decay: 0.01
  scheduler:
    name: cosine
    eta_min: 0.0
  training:
    epochs: 100
    batch_size: 1
    eval_len: 1024
    eval_stride: 1024
    eval_batch_size: 1024
    num_workers: 0
    amp: true
    monitor: p_t
    grad_accum: 8
    swa_last: 0
