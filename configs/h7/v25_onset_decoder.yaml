# v25 integration screen: one fixed likelihood-ratio event potential.
# No weight is selected on validation; q==train OOF prior exactly recovers baseline.
builder: onset_decoder_validation
cfg:
  experiment:
    id: v25_onset_decoder
    seed: 0
    out_root: runs/h7/v25
  integration:
    source_run_template: runs/h7/v25/v25_grouped_recipe_baseline_seed{seed}
    score_run: runs/h7/v25/v25_onset_oof_seed0
    weight: 1.0
    floor: 0.000001
    shuffle_seed: 2501
