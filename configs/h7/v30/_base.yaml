# v30 SCE + one auxiliary branch: shared v27 SCE recipe, validation only
# Generated by scripts/make_v30_configs.py -- do not edit by hand.
inherits: configs/h7/v26/_base.yaml
builder: cached_video_validation_training
cfg:
  experiment:
    id: v30_base_do_not_run
    out_root: runs/h7/v30
    tags:
    - v30
    - sce-aux
    - patient-grouped
    - trainval-only
    notes: v27 SCE plus one training-time auxiliary branch on frozen v26 visual features
  data:
    input_mode: visual
    sequence_mode: full
  model:
    type: sce_aux_adapter
    backbone:
      name: cached_features
    head:
      name: none
    sce_aux:
      aux: change_contrastive
      hidden: 96
      layers: 6
      intermediate_layers:
      - 2
      - 4
      - 6
      attention_reduction: 2
      dropout: 0.5
    num_classes: 16
    dropout: 0.5
  loss:
    name: sce_aux_objective
    aux: change_contrastive
    semantic_weight: 0.8
    smooth_weight: 0.3
    aux_weight: 0.5
    truncation: 4.0
    pair_offset: 2
    margin: 0.5
    window: 8
    cap: 64
  optimizer:
    name: adamw
    lr: 0.0001
    weight_decay: 0.01
  scheduler:
    name: cosine
    eta_min: 0.0
  training:
    epochs: 100
    batch_size: 1
    eval_len: 1024
    eval_stride: 1024
    eval_batch_size: 1024
    num_workers: 0
    amp: true
    monitor: p_t
    grad_accum: 8
    swa_last: 0
