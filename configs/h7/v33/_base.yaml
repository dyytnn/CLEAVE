# v33 end-to-end whole-video: v25 raw-frame data identity, SCE objective, validation only
# Generated by scripts/make_v33_configs.py -- do not edit by hand.
inherits: configs/h7/v25_grouped_recipe_baseline.yaml
builder: kinetic_validation_training
cfg:
  experiment:
    id: v33_base_do_not_run
    out_root: runs/h7/v33
    tags:
    - v33
    - end-to-end
    - patient-grouped
    - trainval-only
    notes: whole-video training with a trainable cross-focal backbone + warm-started
      SCE head
  data:
    dataset: nantes_video_trainval
  model:
    type: e2e_sce
    backbone:
      name: crossfocal
      cnn: resnet18
      pretrained: true
      nhead: 4
    head:
      name: none
    e2e:
      hidden: 96
      layers: 6
      intermediate_layers:
      - 2
      - 4
      - 6
      attention_reduction: 2
      dropout: 0.5
      chunk: 64
      freeze_backbone: false
    num_classes: 16
    dropout: 0.5
  loss:
    name: embryodiff_objective
    semantic_weight: 0.8
    smooth_weight: 0.3
    boundary_weight: 0.0
    diffusion_weight: 0.0
    truncation: 4.0
  optimizer:
    name: adamw
    lr: 0.0001
    weight_decay: 0.01
    backbone_lr_mult: 0.1
  scheduler:
    name: cosine
    eta_min: 0.0
  training:
    epochs: 30
    batch_size: 1
    eval_len: 1024
    eval_stride: 1024
    eval_batch_size: 1024
    num_workers: 12
    amp: true
    monitor: p_t
    grad_accum: 8
    swa_last: 0
